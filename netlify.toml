[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # STRAVA_CLIENT_ID is a public OAuth value (must live in the frontend to start
  # login) — it is not a secret, so exclude it from Netlify's secrets scanner.
  # The real secret, STRAVA_CLIENT_SECRET, is used only server-side and is not omitted.
  SECRETS_SCAN_OMIT_KEYS = "STRAVA_CLIENT_ID"

# Serve the SPA for the OAuth callback path
[[redirects]]
  from = "/callback"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

# Security headers (defense in depth)
[[headers]]
  for = "/*"
  [headers.values]
    # Even if markup were injected, scripts/connections are restricted to known
    # origins — blocking exfiltration of the Strava tokens held in localStorage.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://www.strava.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
